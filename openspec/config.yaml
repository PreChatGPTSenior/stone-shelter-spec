schema: spec-driven
context: |
  Stone Shelter product specification and lightweight static-analysis scaffold.
  Canonical requirements and acceptance scenarios live in openspec/specs.
  product-baseline is immutable source evidence; no implementation is bundled.
  Declare language/framework assumption changes before each implementation experiment.
  Every task batch starts with explicit readiness. Keep artifacts in English.
  Generate HTTP contracts from implementation; maintain AsyncAPI before Kafka changes.
  No runtime, deployment, Sonar, browser runner, model dispatch or Warden integration.
